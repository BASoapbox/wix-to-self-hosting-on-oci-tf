# =============================================================================
# yourdomain.com (Grav) — Nginx, HTTP block
# =============================================================================
# Deploy this FIRST, before DNS is pointed and before Certbot runs. It serves
# the ACME HTTP-01 challenge Certbot needs to issue the cert, and proxies
# everything else to the Grav container on 127.0.0.1:2380.
#
# Install:
#   sudo cp yourdomain-http.conf /etc/nginx/sites-available/yourdomain.com
#   sudo ln -s /etc/nginx/sites-available/yourdomain.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# After Certbot runs, it edits this file in place to add the HTTPS server
# block and the port-80-to-443 redirect — see ssl-reference.md.

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:2380;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 50m;
    }
}
